version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codespark-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-codespark}
      POSTGRES_USER: ${POSTGRES_USER:-codespark}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codespark} -d ${POSTGRES_DB:-codespark}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: codespark-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-codespark}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD environment variable must be set}@postgres:5432/${POSTGRES_DB:-codespark}
      CODESPARK_SECRET_KEY: ${CODESPARK_SECRET_KEY:?CODESPARK_SECRET_KEY environment variable must be set}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://codespark.pages.dev,http://localhost:8000,http://127.0.0.1:8000}
      HOST: 0.0.0.0
      PORT: 8000
    ports:
      - "8000:8000"

volumes:
  postgres_data:
    driver: local
