version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: codespark_postgres
    restart: always
    environment:
      POSTGRES_USER: codespark_user
      POSTGRES_PASSWORD: secure_db_password_2026
      POSTGRES_DB: codespark_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codespark_user -d codespark_prod"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: codespark_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://codespark_user:secure_db_password_2026@postgres:5432/codespark_prod
      SECRET_KEY: ${SECRET_KEY:-codespark_prod_secret_key_change_me_in_env_2026}
      DATA_DIR: /app/data
      UPLOAD_DIR: /app/data/uploads
    ports:
      - "8000:8000"
    volumes:
      - app_storage:/app/data

volumes:
  postgres_data:
  app_storage:
