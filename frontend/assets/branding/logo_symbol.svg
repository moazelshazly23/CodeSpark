<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>Code Spark - Official Symbol</title>
  <desc>Stylized geometric hexagonal and beveled letter C with bright 4-pointed center sparkle and upper-right spark in rich emerald green palette.</desc>
  <defs>
    
    <linearGradient id="sym_outer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A4E0B8"/>
      <stop offset="25%" stop-color="#82C497"/>
      <stop offset="65%" stop-color="#60A175"/>
      <stop offset="100%" stop-color="#1E472B"/>
    </linearGradient>
    <linearGradient id="sym_inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A175"/>
      <stop offset="35%" stop-color="#1E472B"/>
      <stop offset="85%" stop-color="#03260E"/>
      <stop offset="100%" stop-color="#1E472B"/>
    </linearGradient>
    <linearGradient id="sym_ridge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3F8EB"/>
      <stop offset="50%" stop-color="#A4E0B8"/>
      <stop offset="100%" stop-color="#82C497"/>
    </linearGradient>
    <linearGradient id="sym_star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#E3F8EB"/>
      <stop offset="65%" stop-color="#A4E0B8"/>
      <stop offset="100%" stop-color="#60A175"/>
    </linearGradient>
    <radialGradient id="sym_center_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#82C497" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#60A175" stop-opacity="0.25"/>
      <stop offset="75%" stop-color="#1E472B" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#060807" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sym_small_aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A4E0B8" stop-opacity="0.60"/>
      <stop offset="50%" stop-color="#60A175" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#060807" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="code-spark-symbol">
    
    <!-- Emblem Glow Auras -->
    <circle cx="231.5" cy="287.0" r="105" fill="url(#sym_center_aura)"/>
    <circle cx="392.5" cy="111.0" r="50" fill="url(#sym_small_aura)"/>

    <!-- Stylized Geometric Hexagonal/Beveled C -->
    <g id="sym_hexagonal_c">
      <!-- Inner / Recessed Facet -->
      <path d="M 330.50,179.00 L 200.50,179.00 L 125.50,254.00 L 125.50,320.00 L 200.50,395.00 L 330.50,395.00 L 303.50,363.00 L 213.50,363.00 L 157.50,307.00 L 157.50,267.00 L 213.50,211.00 L 303.50,211.00 Z" fill="url(#sym_inner)"/>
      <!-- Outer / Raised Facet -->
      <path d="M 357.50,147.00 L 187.50,147.00 L 93.50,241.00 L 93.50,333.00 L 187.50,427.00 L 357.50,427.00 L 330.50,395.00 L 200.50,395.00 L 125.50,320.00 L 125.50,254.00 L 200.50,179.00 L 330.50,179.00 Z" fill="url(#sym_outer)"/>
      <!-- Luminous Central Ridge -->
      <path d="M 330.50,179.00 L 200.50,179.00 L 125.50,254.00 L 125.50,320.00 L 200.50,395.00 L 330.50,395.00" fill="none" stroke="url(#sym_ridge)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <!-- Outer Chamfer Highlight Line -->
      <path d="M 357.50,147.00 L 187.50,147.00 L 93.50,241.00 L 93.50,333.00" fill="none" stroke="#E3F8EB" stroke-width="2" stroke-opacity="0.85" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- Center Bright 4-Pointed Sparkle Star -->
    <g id="sym_center_sparkle">
      <path d="M 231.50,229.00 C 231.50,274.00 244.50,287.00 289.50,287.00 C 244.50,287.00 231.50,300.00 231.50,345.00 C 231.50,300.00 218.50,287.00 173.50,287.00 C 218.50,287.00 231.50,274.00 231.50,229.00 Z" fill="url(#sym_star)"/>
      <path d="M 245.64,272.86 C 235.04,283.46 235.04,290.54 245.64,301.14 C 235.04,290.54 227.96,290.54 217.36,301.14 C 227.96,290.54 227.96,283.46 217.36,272.86 C 227.96,283.46 235.04,283.46 245.64,272.86 Z" fill="#E3F8EB" opacity="0.85"/>
      <circle cx="231.5" cy="287.0" r="4.5" fill="#FFFFFF"/>
    </g>

    <!-- Small Sparkle Star Above Right -->
    <g id="sym_small_sparkle">
      <path d="M 392.50,85.00 C 392.50,105.00 398.50,111.00 418.50,111.00 C 398.50,111.00 392.50,117.00 392.50,137.00 C 392.50,117.00 386.50,111.00 366.50,111.00 C 386.50,111.00 392.50,105.00 392.50,85.00 Z" fill="url(#sym_star)"/>
      <path d="M 398.86,104.64 C 394.27,109.23 394.27,112.77 398.86,117.36 C 394.27,112.77 390.73,112.77 386.14,117.36 C 390.73,112.77 390.73,109.23 386.14,104.64 C 390.73,109.23 394.27,109.23 398.86,104.64 Z" fill="#E3F8EB" opacity="0.85"/>
      <circle cx="392.5" cy="111.0" r="2.2" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
