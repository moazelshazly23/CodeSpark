<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="spark_bg" cx="50%" cy="50%" r="50%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#0E3019" />
      <stop offset="60%" stop-color="#060807" />
      <stop offset="100%" stop-color="#03260E" />
    </radialGradient>
    <linearGradient id="c_gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8CD6A3" />
      <stop offset="35%" stop-color="#60A175" />
      <stop offset="70%" stop-color="#1E472B" />
      <stop offset="100%" stop-color="#0B3016" />
    </linearGradient>
    <linearGradient id="main_spark_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B9F5CD" />
      <stop offset="40%" stop-color="#8CD6A3" />
      <stop offset="100%" stop-color="#60A175" />
    </linearGradient>
    <linearGradient id="small_spark_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2FCEB" />
      <stop offset="100%" stop-color="#8CD6A3" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Circular Base -->
  <circle cx="256" cy="256" r="240" fill="url(#spark_bg)" stroke="#1E472B" stroke-width="6" />

  <!-- Main C Shape: Geometric faceted outer left, smooth dynamic flow -->
  <!-- Coordinates scaled to 512x512 -->
  <g id="logo-symbol">
    <!-- Stylized C -->
    <path d="M 370,110 
             C 290,65 190,75 116,135 
             L 64,242 
             C 56,252 56,264 64,274 
             L 116,380 
             C 190,442 292,450 372,402 
             L 332,336 
             C 278,368 206,362 155,324 
             L 122,258 
             L 155,190 
             C 206,152 278,146 332,178 
             Z" 
          fill="url(#c_gradient)" />

    <!-- Center Primary Sparkle Star -->
    <path d="M 330,170 
             Q 330,258 418,258 
             Q 330,258 330,346 
             Q 330,258 242,258 
             Q 330,258 330,170 Z" 
          fill="url(#main_spark_grad)" 
          filter="url(#glow)" />

    <!-- Top Right Sparkle Star (Medium) -->
    <path d="M 405,178 
             Q 405,200 427,200 
             Q 405,200 405,222 
             Q 405,200 383,200 
             Q 405,200 405,178 Z" 
          fill="url(#small_spark_grad)" />

    <!-- Top Right Sparkle Star (Smallest, Upper) -->
    <path d="M 436,128 
             Q 436,146 454,146 
             Q 436,146 436,164 
             Q 436,146 418,146 
             Q 436,146 436,128 Z" 
          fill="url(#small_spark_grad)" />
  </g>
</svg>
